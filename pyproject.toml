[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldattention"
version = "0.1.0"
description = "LD-aware attention modules for genomic downstream tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
vcf = ["cyvcf2>=0.31"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ldattention*"]
